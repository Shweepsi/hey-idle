name: Build Signed Android AAB & APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Update Android version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/APP_VERSION = \"[^\"]*\"/APP_VERSION = \"$VERSION\"/" src/version.ts
          echo "Updated to versionCode: ${{ github.run_number }}, versionName: $VERSION"

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/my-release-key.keystore

      - name: Build signed AAB
        run: ./gradlew bundleRelease --parallel --build-cache
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build signed APK
        run: ./gradlew assembleRelease --parallel --build-cache
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Move AAB and APK to builds directory
        run: |
          mkdir -p builds
          mv android/app/build/outputs/bundle/release/app-release.aab builds/IdleGrow.aab
          mv android/app/build/outputs/apk/release/app-release.apk builds/IdleGrow.apk

      - name: Determine tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${{ github.run_number }}-$(echo $GITHUB_SHA | cut -c1-7)"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag "$TAG_NAME" -f
            git push origin "$TAG_NAME" -f
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Upload AAB and APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Build ${{ env.TAG_NAME }}"
          files: |
            builds/IdleGrow.aab
            builds/IdleGrow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
